services:
  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      OCR_LANGS: ${OCR_LANGS:-hye+rus+eng}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-500}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped
