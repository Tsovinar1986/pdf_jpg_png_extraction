<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scanline &mdash; Text Extractor</title>
<link rel="stylesheet" href="style.css">
</head>
<body class="min-h-screen relative flex items-center justify-center overflow-x-hidden p-4 py-8 font-sans text-slate-800 bg-paper dark:text-slate-100 dark:bg-ink">

  <div class="pointer-events-none fixed inset-0 z-0 overflow-hidden" aria-hidden="true">
    <div class="animate-blob-drift absolute -top-28 -left-24 h-[420px] w-[420px] rounded-full bg-accent opacity-20 blur-[110px] dark:opacity-35"></div>
    <div class="animate-blob-drift absolute -bottom-32 -right-24 h-[420px] w-[420px] rounded-full bg-accent2 opacity-20 blur-[110px] dark:opacity-35" style="animation-delay:-8s"></div>

    <!-- faint scanned-page silhouette with a sweeping scan line, evoking a document being read -->
    <div class="absolute left-1/2 top-1/2 h-[580px] w-[400px] -translate-x-1/2 -translate-y-1/2 overflow-hidden rounded-2xl border border-black/10 opacity-[0.07] dark:border-white/20 dark:opacity-[0.14]">
      <div class="absolute inset-x-6 top-8 h-2 rounded bg-current"></div>
      <div class="absolute inset-x-6 top-14 h-2 w-2/3 rounded bg-current"></div>
      <div class="absolute inset-x-6 top-24 h-2 rounded bg-current"></div>
      <div class="absolute inset-x-6 top-32 h-2 w-4/5 rounded bg-current"></div>
      <div class="absolute inset-x-6 top-44 h-2 rounded bg-current"></div>
      <div class="absolute inset-x-6 top-52 h-2 w-3/5 rounded bg-current"></div>
      <div class="absolute inset-x-0 top-0 h-1.5 bg-gradient-to-r from-transparent via-accent2 to-transparent opacity-80 animate-scan"></div>
    </div>

    <!-- characters drifting upward, standing in for text being lifted out of a scanned page (Armenian/Cyrillic/Latin — this app's OCR languages) -->
    <span class="animate-glyph-float absolute bottom-0 text-2xl font-semibold text-accent/30 dark:text-accent/40" style="left:4%;animation-duration:15s;animation-delay:-3s">Ա</span>
    <span class="animate-glyph-float absolute bottom-0 text-xl font-semibold text-accent2/30 dark:text-accent2/40" style="left:12%;animation-duration:19s;animation-delay:-9s">Ж</span>
    <span class="animate-glyph-float absolute bottom-0 text-lg font-semibold text-accent/25 dark:text-accent/35" style="left:20%;animation-duration:13s;animation-delay:-1s">Q</span>
    <span class="animate-glyph-float absolute bottom-0 text-3xl font-semibold text-accent2/25 dark:text-accent2/35" style="left:28%;animation-duration:21s;animation-delay:-14s">Ք</span>
    <span class="animate-glyph-float absolute bottom-0 text-xl font-semibold text-accent/30 dark:text-accent/40" style="left:36%;animation-duration:16s;animation-delay:-6s">R</span>
    <span class="animate-glyph-float absolute bottom-0 text-2xl font-semibold text-accent2/30 dark:text-accent2/40" style="left:44%;animation-duration:12s;animation-delay:-4s">Я</span>
    <span class="animate-glyph-float absolute bottom-0 text-lg font-semibold text-accent/25 dark:text-accent/35" style="left:52%;animation-duration:18s;animation-delay:-11s">Ֆ</span>
    <span class="animate-glyph-float absolute bottom-0 text-2xl font-semibold text-accent2/30 dark:text-accent2/40" style="left:60%;animation-duration:14s;animation-delay:-7s">A</span>
    <span class="animate-glyph-float absolute bottom-0 text-xl font-semibold text-accent/25 dark:text-accent/35" style="left:68%;animation-duration:20s;animation-delay:-2s">Щ</span>
    <span class="animate-glyph-float absolute bottom-0 text-3xl font-semibold text-accent2/25 dark:text-accent2/35" style="left:76%;animation-duration:17s;animation-delay:-13s">Բ</span>
    <span class="animate-glyph-float absolute bottom-0 text-lg font-semibold text-accent/30 dark:text-accent/40" style="left:84%;animation-duration:15s;animation-delay:-5s">G</span>
    <span class="animate-glyph-float absolute bottom-0 text-2xl font-semibold text-accent2/30 dark:text-accent2/40" style="left:92%;animation-duration:19s;animation-delay:-10s">Ф</span>
    <span class="animate-glyph-float absolute bottom-0 text-xl font-semibold text-accent/25 dark:text-accent/35" style="left:8%;animation-duration:22s;animation-delay:-17s">T</span>
    <span class="animate-glyph-float absolute bottom-0 text-lg font-semibold text-accent2/25 dark:text-accent2/35" style="left:56%;animation-duration:13s;animation-delay:-8s">Գ</span>
  </div>

  <main class="relative z-10 w-full max-w-xl rounded-3xl border border-black/10 bg-[#fffaf3]/85 p-8 shadow-2xl shadow-slate-900/10 backdrop-blur-xl dark:border-white/10 dark:bg-[#251d16]/60 dark:shadow-black/40">

    <header class="mb-7 text-center">
      <div class="mx-auto mb-3 flex h-12 w-12 items-center justify-center rounded-2xl bg-accent/10 text-accent dark:bg-accent/15 dark:text-accent">
        <svg viewBox="0 0 24 24" fill="none" class="h-6 w-6" aria-hidden="true">
          <rect x="4.5" y="3" width="15" height="18" rx="2" stroke="currentColor" stroke-width="1.6"/>
          <path d="M8 8.5h8M8 12h8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
          <path d="M4.5 15.5h15" stroke="#3f6259" class="dark:opacity-90" stroke-width="1.8" stroke-linecap="round"/>
        </svg>
      </div>
      <h1 class="mb-1.5 bg-gradient-to-r from-accent to-accent2 bg-clip-text text-2xl font-bold tracking-tight text-transparent">Scanline</h1>
      <p class="mb-2.5 text-[11px] font-semibold uppercase tracking-[0.18em] text-accent2 dark:text-accent2/80">Multilingual OCR &amp; text extraction</p>
      <p class="text-sm leading-relaxed text-slate-500 dark:text-slate-400">Upload a PDF, image, spreadsheet, or document &mdash; get the extracted text in seconds.</p>
    </header>

    <label id="dropzone" for="fileInput"
      class="group flex cursor-pointer flex-col items-center justify-center gap-2 rounded-2xl border-2 border-dashed border-slate-300 px-5 py-8 text-center transition hover:border-accent hover:bg-accent/5 dark:border-white/20 dark:hover:bg-accent/10 [&.dragover]:scale-[1.01] [&.dragover]:border-accent2 [&.dragover]:bg-accent2/10">
      <input type="file" id="fileInput" accept=".pdf,.png,.jpg,.jpeg,.tif,.tiff,.bmp,.gif,.webp,.heic,.heif,.xlsx,.xlsm,.docx,.csv,.txt,application/pdf,image/*,image/heic,image/heif" hidden>
      <svg viewBox="0 0 24 24" fill="none" class="h-6 w-6 text-slate-400 transition-transform group-hover:-translate-y-0.5 group-hover:text-accent" aria-hidden="true">
        <path d="M12 16V4m0 0-4 4m4-4 4 4" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M4 16v2.5A2.5 2.5 0 0 0 6.5 21h11a2.5 2.5 0 0 0 2.5-2.5V16" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <div class="text-[15px] text-slate-700 dark:text-slate-100">
        <strong>Click to select</strong> or drag a file here
      </div>
      <div class="text-xs text-slate-400 dark:text-slate-400">PDF, JPG, PNG, TIFF, BMP, GIF, WEBP, HEIC, XLSX, DOCX, CSV, TXT</div>
    </label>

    <div id="fileInfo" class="hidden mt-3.5 flex items-center gap-2.5 rounded-xl border border-black/10 bg-black/5 px-3.5 py-2.5 text-sm dark:border-white/10 dark:bg-white/5">
      <svg viewBox="0 0 24 24" fill="none" class="h-4 w-4 flex-shrink-0 text-accent2" aria-hidden="true">
        <rect x="4.5" y="3" width="15" height="18" rx="2" stroke="currentColor" stroke-width="1.6"/>
        <path d="M8 8.5h8M8 12h8M8 15.5h5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
      </svg>
      <span id="fileName" class="flex-1 truncate"></span>
      <button id="clearFile" type="button" aria-label="Remove file"
        class="rounded-md p-1 text-slate-400 transition hover:bg-danger/10 hover:text-danger">
        <svg viewBox="0 0 24 24" fill="none" class="h-4 w-4" aria-hidden="true">
          <path d="M6 6l12 12M18 6 6 18" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
        </svg>
      </button>
    </div>

    <div class="mt-[18px] flex justify-center">
      <button id="submitBtn" type="button" disabled
        class="min-w-[220px] rounded-xl bg-accent px-5 py-3 text-[15px] font-semibold text-white transition enabled:hover:-translate-y-0.5 enabled:hover:bg-[#a8431f] enabled:hover:shadow-lg enabled:hover:shadow-accent/30 disabled:cursor-not-allowed disabled:opacity-40">
        <span id="submitLabel">Extract text</span>
      </button>
    </div>

    <div id="progress" class="hidden mt-5 flex flex-col gap-2.5 text-[13px] text-slate-500 dark:text-slate-400">
      <div class="relative h-1.5 overflow-hidden rounded-full bg-black/10 dark:bg-white/10">
        <div id="progressBarFill" class="h-full w-0 rounded-full bg-gradient-to-r from-accent to-accent2 transition-[width] duration-150 ease-out [&.indeterminate]:animate-indeterminate"></div>
      </div>
      <div class="flex items-center gap-3">
        <div class="h-5 w-5 flex-shrink-0 animate-spin rounded-full border-[2.5px] border-black/10 border-t-accent2 dark:border-white/20"></div>
        <span id="progressText">Extracting&hellip; this can take a moment for scanned pages</span>
      </div>
    </div>

    <div id="errorBox" class="hidden mt-[18px] rounded-xl border border-danger/30 bg-danger/10 px-3.5 py-3 text-[13px] text-danger"></div>

    <section id="resultBox" class="hidden mt-[22px]">
      <div class="mb-2 flex items-center justify-between">
        <span class="text-[13px] text-slate-500 dark:text-slate-400">Extracted text</span>
        <div class="flex gap-2">
          <button id="downloadBtn" type="button"
            class="rounded-lg border border-black/10 bg-black/5 px-3 py-1.5 text-xs text-slate-700 transition hover:bg-black/10 dark:border-white/10 dark:bg-white/5 dark:text-slate-100 dark:hover:bg-white/10">Download .txt</button>
          <button id="downloadDocxBtn" type="button"
            class="rounded-lg border border-black/10 bg-black/5 px-3 py-1.5 text-xs text-slate-700 transition hover:bg-black/10 dark:border-white/10 dark:bg-white/5 dark:text-slate-100 dark:hover:bg-white/10">Download .docx</button>
          <button id="copyBtn" type="button"
            class="rounded-lg border border-black/10 bg-black/5 px-3 py-1.5 text-xs text-slate-700 transition hover:bg-black/10 dark:border-white/10 dark:bg-white/5 dark:text-slate-100 dark:hover:bg-white/10"><span id="copyBtnLabel">Copy</span></button>
        </div>
      </div>
      <img id="resultImagePreview" class="hidden mb-2.5 block max-h-56 w-full rounded-xl border border-black/10 bg-black/5 object-contain dark:border-white/10 dark:bg-black/25" alt="Uploaded image preview">
      <div id="normalizedPreviewBox" class="hidden mb-2.5">
        <div class="mb-1.5 text-xs text-slate-500 dark:text-slate-400">Cleaned version (white background, black text)</div>
        <a id="normalizedPreviewLink" href="#" download>
          <img id="normalizedPreviewImg" class="block max-h-56 w-full rounded-xl border border-black/10 bg-black/5 object-contain dark:border-white/10 dark:bg-black/25" alt="Cleaned white-background version">
        </a>
      </div>
      <textarea id="resultText" readonly
        class="min-h-[220px] w-full resize-y rounded-xl border border-black/10 bg-black/5 p-3.5 font-sans text-sm leading-relaxed text-slate-800 outline-none focus:border-accent/50 dark:border-white/10 dark:bg-black/25 dark:text-slate-100"></textarea>
    </section>

  </main>

  <form id="downloadForm" action="/api/download-text" method="POST" target="downloadFrame" hidden>
    <input type="hidden" name="text" id="downloadTextInput">
    <input type="hidden" name="filename" id="downloadFilenameInput">
  </form>
  <form id="downloadDocxForm" action="/api/download-docx" method="POST" target="downloadFrame" hidden>
    <input type="hidden" name="text" id="downloadDocxTextInput">
    <input type="hidden" name="filename" id="downloadDocxFilenameInput">
  </form>
  <iframe name="downloadFrame" hidden></iframe>

  <script src="script.js"></script>
</body>
</html>
