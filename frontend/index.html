<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PDF / Image Text Extractor</title>
<link rel="stylesheet" href="style.css">
</head>
<body class="min-h-screen relative flex items-center justify-center overflow-x-hidden p-4 py-8 font-sans text-slate-800 bg-slate-100 dark:text-slate-100 dark:bg-[#0f1220]">

  <div class="pointer-events-none fixed -top-28 -left-24 z-0 h-[420px] w-[420px] rounded-full bg-accent opacity-20 blur-[110px] dark:opacity-35"></div>
  <div class="pointer-events-none fixed -bottom-32 -right-24 z-0 h-[420px] w-[420px] rounded-full bg-accent2 opacity-20 blur-[110px] dark:opacity-35"></div>

  <main class="relative z-10 w-full max-w-xl rounded-3xl border border-black/10 bg-white/80 p-8 shadow-2xl shadow-slate-900/10 backdrop-blur-xl dark:border-white/10 dark:bg-white/[0.06] dark:shadow-black/40">

    <header class="mb-7 text-center">
      <div class="mb-2 text-4xl leading-none">📄</div>
      <h1 class="mb-2 bg-gradient-to-r from-accent to-accent2 bg-clip-text text-2xl font-bold text-transparent">Text Extractor</h1>
      <p class="text-sm leading-relaxed text-slate-500 dark:text-slate-400">Upload a PDF, image, spreadsheet, or document &mdash; get the extracted text in seconds</p>
    </header>

    <label id="dropzone" for="fileInput"
      class="group flex cursor-pointer flex-col items-center justify-center gap-1.5 rounded-2xl border-2 border-dashed border-slate-300 px-5 py-8 text-center transition hover:border-accent hover:bg-accent/5 dark:border-white/20 dark:hover:bg-accent/10 [&.dragover]:scale-[1.01] [&.dragover]:border-accent2 [&.dragover]:bg-accent2/10">
      <input type="file" id="fileInput" accept=".pdf,.png,.jpg,.jpeg,.tif,.tiff,.bmp,.gif,.webp,.heic,.heif,.xlsx,.xlsm,.docx,.csv,.txt,application/pdf,image/*,image/heic,image/heif" hidden>
      <div class="text-2xl transition-transform group-hover:-translate-y-0.5">⬆️</div>
      <div class="text-[15px] text-slate-700 dark:text-slate-100">
        <strong>Click to select</strong> or drag a file here
      </div>
      <div class="text-xs text-slate-400 dark:text-slate-400">PDF, JPG, PNG, TIFF, BMP, GIF, WEBP, HEIC, XLSX, DOCX, CSV, TXT</div>
    </label>

    <div id="fileInfo" class="hidden mt-3.5 flex items-center gap-2.5 rounded-xl border border-black/10 bg-black/5 px-3.5 py-2.5 text-sm dark:border-white/10 dark:bg-white/5">
      <span>📄</span>
      <span id="fileName" class="flex-1 truncate"></span>
      <button id="clearFile" type="button" aria-label="Remove file"
        class="rounded-md p-1 text-slate-400 transition hover:bg-danger/10 hover:text-danger">✕</button>
    </div>

    <div class="mt-[18px] flex justify-center">
      <button id="submitBtn" type="button" disabled
        class="min-w-[220px] rounded-xl bg-gradient-to-r from-accent to-accent2 px-5 py-3 text-[15px] font-semibold text-white transition enabled:hover:-translate-y-0.5 enabled:hover:shadow-lg enabled:hover:shadow-accent/30 disabled:cursor-not-allowed disabled:opacity-40">
        <span id="submitLabel">Extract text</span>
      </button>
    </div>

    <div id="progress" class="hidden mt-5 flex flex-col gap-2.5 text-[13px] text-slate-500 dark:text-slate-400">
      <div class="relative h-1.5 overflow-hidden rounded-full bg-black/10 dark:bg-white/10">
        <div id="progressBarFill" class="h-full w-0 rounded-full bg-gradient-to-r from-accent to-accent2 transition-[width] duration-150 ease-out [&.indeterminate]:animate-indeterminate"></div>
      </div>
      <div class="flex items-center gap-3">
        <div class="h-5 w-5 flex-shrink-0 animate-spin rounded-full border-[2.5px] border-black/10 border-t-accent2 dark:border-white/20"></div>
        <span id="progressText">Extracting&hellip; this can take a moment for scanned pages</span>
      </div>
    </div>

    <div id="errorBox" class="hidden mt-[18px] rounded-xl border border-danger/30 bg-danger/10 px-3.5 py-3 text-[13px] text-danger"></div>

    <section id="resultBox" class="hidden mt-[22px]">
      <div class="mb-2 flex items-center justify-between">
        <span class="text-[13px] text-slate-500 dark:text-slate-400">Extracted text</span>
        <div class="flex gap-2">
          <button id="downloadBtn" type="button"
            class="rounded-lg border border-black/10 bg-black/5 px-3 py-1.5 text-xs text-slate-700 transition hover:bg-black/10 dark:border-white/10 dark:bg-white/5 dark:text-slate-100 dark:hover:bg-white/10">Download</button>
          <button id="copyBtn" type="button"
            class="rounded-lg border border-black/10 bg-black/5 px-3 py-1.5 text-xs text-slate-700 transition hover:bg-black/10 dark:border-white/10 dark:bg-white/5 dark:text-slate-100 dark:hover:bg-white/10">Copy</button>
        </div>
      </div>
      <img id="resultImagePreview" class="hidden mb-2.5 block max-h-56 w-full rounded-xl border border-black/10 bg-black/5 object-contain dark:border-white/10 dark:bg-black/25" alt="Uploaded image preview">
      <div id="normalizedPreviewBox" class="hidden mb-2.5">
        <div class="mb-1.5 text-xs text-slate-500 dark:text-slate-400">Cleaned version (white background, black text)</div>
        <a id="normalizedPreviewLink" href="#" download>
          <img id="normalizedPreviewImg" class="block max-h-56 w-full rounded-xl border border-black/10 bg-black/5 object-contain dark:border-white/10 dark:bg-black/25" alt="Cleaned white-background version">
        </a>
      </div>
      <textarea id="resultText" readonly
        class="min-h-[220px] w-full resize-y rounded-xl border border-black/10 bg-black/5 p-3.5 font-sans text-sm leading-relaxed text-slate-800 outline-none focus:border-accent/50 dark:border-white/10 dark:bg-black/25 dark:text-slate-100"></textarea>
    </section>

  </main>

  <form id="downloadForm" action="/api/download-text" method="POST" target="downloadFrame" hidden>
    <input type="hidden" name="text" id="downloadTextInput">
    <input type="hidden" name="filename" id="downloadFilenameInput">
  </form>
  <iframe name="downloadFrame" hidden></iframe>

  <script src="script.js"></script>
</body>
</html>
